# Production build + deploy pipeline.
# Runs in GitHub Actions, then uploads the built dist to Netlify via the CLI.
# Netlify's own git-triggered production builds are skipped in netlify.toml.
#
# On a normal code push to main, the precomputed content artifacts (sitemaps,
# RSS, localities, images, etc.) are reused from the repo and SKIP_PRECOMPUTE=1.
# On the nightly schedule, the job refreshes those artifacts from scratch.
#
# Required repository secrets for deploy:
#   NETLIFY_AUTH_TOKEN  — personal/access token with deploy rights
#   NETLIFY_SITE_ID     — Netlify site id for 360ghar.com

name: Content / SEO full build

on:
  push:
    branches:
      - main
  schedule:
    # 18:30 UTC ≈ 00:00 IST
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: content-build
  cancel-in-progress: false

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FULL_BUILD: '1'
      NODE_VERSION: '20'
      VITE_API_SERVER: https://api.360ghar.com
      VITE_API_BASE_URL: https://api.360ghar.com/api/v1
      SKIP_BROTLI: '1'
      # Vite uses these to set __PRERENDER_NO_FETCH__=false and __PRERENDER_DATA_SOURCE__=bulk
      # so the Puppeteer prerender uses pre-fetched bulk data instead of empty payloads.
      NETLIFY: 'true'
      CONTEXT: production
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/puppeteer
      PRERENDER_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/prerender-html
      PRERENDER_CONCURRENCY: '5'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reuse precomputed content for push builds
        if: github.event_name == 'push'
        run: echo "SKIP_PRECOMPUTE=1" >> "$GITHUB_ENV"

      - name: Full content build
        run: npm run build:full

      - name: Deploy to Netlify (production)
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: |
          # --no-build is required: without it, netlify-cli re-runs build.command
          # (build:preview) and overwrites the build:full dist artifact.
          npx netlify-cli deploy \
            --prod \
            --dir=dist \
            --no-build \
            --message "content-build ${GITHUB_SHA}"

      - name: Post-deploy smoke (no self-301 loop)
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: |
          set -euo pipefail
          # Allow CDN a few seconds to flip production.
          sleep 5
          fail=0
          for path in / /properties /about-us; do
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null --max-redirs 0 --max-time 20 \
              -w '%{http_code}' "https://360ghar.com${path}" || echo "000")
            loc=$(grep -i '^location:' "$headers" | head -1 | awk '{print $2}' | tr -d '\r' || true)
            rm -f "$headers"
            echo "smoke ${path} -> HTTP ${code} Location=${loc:-none}"
            # These paths must be 200/304 — any 3xx (including self-301 loops) fails the deploy.
            if [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "308" ]; then
              if [ "$loc" = "$path" ] || [ "$loc" = "https://360ghar.com${path}" ] || [ "$loc" = "https://360ghar.com${path%/}/" ]; then
                echo "::error::Self-redirect loop detected on ${path}"
              else
                echo "::error::Unexpected redirect on ${path} (code ${code} -> ${loc})"
              fi
              fail=1
            elif [ "$code" != "200" ] && [ "$code" != "304" ]; then
              echo "::error::Expected 200 for ${path}, got ${code}"
              fail=1
            fi
          done
          # Body must be HTML, not a redirect stub.
          html=$(mktemp)
          curl -sS --max-redirs 3 --max-time 20 "https://360ghar.com/" -o "$html" || true
          echo "homepage body snip: $(head -c 200 "$html" || true)"
          grep -Eiq '<!doctype html|<html' "$html" || {
            echo "::error::Homepage body is not HTML"
            fail=1
          }
          # Hashed JS from the shell must be reachable (catches edge/static 301 regressions).
          script=$(grep -Eo '/assets/[^"[:space:]]+\.js' "$html" | head -1 || true)
          rm -f "$html"
          if [ -n "${script:-}" ]; then
            acode=$(curl -sS -o /dev/null --max-redirs 0 --max-time 20 \
              -w '%{http_code}' "https://360ghar.com${script}" || echo "000")
            echo "smoke asset ${script} -> HTTP ${acode}"
            if [ "$acode" != "200" ] && [ "$acode" != "304" ]; then
              echo "::error::Expected 200 for asset ${script}, got ${acode}"
              fail=1
            fi
          else
            echo "::error::No /assets/*.js reference found in homepage HTML"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Production smoke checks failed — site may still be down"
            exit 1
          fi
          echo "Production smoke checks passed."

      - name: Skip deploy notice
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        run: |
          echo "NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set — build succeeded; deploy skipped."
          echo "Add both secrets to enable production deploys from this workflow."
