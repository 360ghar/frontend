# Scheduled content precompute job.
# Fetches/scrapes API and external data, builds vendored SEO artifacts,
# and commits them to main so Netlify preview builds can skip the heavy work.
#
# The commit message includes [skip ci] to avoid retriggering this workflow.

name: Precompute content artifacts

on:
  schedule:
    # 18:00 UTC — run 30 minutes before the nightly production build.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: precompute-content
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: '20'
      VITE_API_SERVER: https://api.360ghar.com
      VITE_API_BASE_URL: https://api.360ghar.com/api/v1
      SKIP_BROTLI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Give the workflow permission to push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Precompute content artifacts
        run: npm run build:content

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public src/data scripts/image-optimization-manifest.json
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh precomputed content artifacts [skip ci]"
          git push
